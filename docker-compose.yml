services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: maqad
      POSTGRES_USER: maqad
      POSTGRES_PASSWORD: maqad
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maqad -d maqad"]
      interval: 2s
      timeout: 3s
      retries: 30
    # No host port: the database stays on the internal network.

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: maqad
      DB_USERNAME: maqad
      DB_PASSWORD: maqad
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  db-data:
